[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pranav Jain", email = "pranav.avlok@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncio>=4.0.0",
    "dotenv-python>=0.0.1",
    "fastapi>=0.146.0",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.4",
    "openai>=3.19.0",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "spacy>=3.8.16",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "pytest>=9.1.1",
]
